<!DOCTYPE html>
<html>
<head>
<title>Student Test Scores Manager</title>

<style>
body{
font-family: Arial;
text-align:center;
padding:30px;
background:#f4f6f9;
}

table{
border-collapse:collapse;
margin:auto;
margin-top:20px;
width:70%;
}

th,td{
border:1px solid black;
padding:10px;
}

th{
background:#4CAF50;
color:white;
}

input{
padding:6px;
margin:4px;
}

button{
padding:8px 12px;
margin:6px;
cursor:pointer;
}
</style>

</head>

<body>

<h1>Student Test Scores Manager</h1>

<h3>Add Student Scores</h3>

Student Name
<input id="name">

Math
<input id="math" type="number">

Science
<input id="science" type="number">

English
<input id="english" type="number">

<button onclick="addStudent()">Add Student</button>

<table id="scoreTable">

<thead>
<tr>
<th>Student</th>
<th>Math</th>
<th>Science</th>
<th>English</th>
</tr>
</thead>

<tbody></tbody>

</table>

<h3>Compute Student Average</h3>

Student Index
<input id="avgStudent" type="number">

<button onclick="computeAverage()">Compute Average</button>

<p id="avgResult"></p>

<script>

let scores = []
let names = []

function addStudent(){

let name = document.getElementById("name").value

let math = Number(document.getElementById("math").value)
let science = Number(document.getElementById("science").value)
let english = Number(document.getElementById("english").value)

let studentScores = [math, science, english]

scores.push(studentScores)
names.push(name)

displayScores()

}

function displayScores(){

let table = document.querySelector("#scoreTable tbody")

table.innerHTML = ""

for(let i=0;i<scores.length;i++){

let row = "<tr>"

row += "<td>" + names[i] + "</td>"

for(let j=0;j<scores[i].length;j++){
row += "<td>" + scores[i][j] + "</td>"
}

row += "</tr>"

table.innerHTML += row

}

}

function computeAverage(){

let s = document.getElementById("avgStudent").value

let total = 0

for(let i=0;i<scores[s].length;i++){
total += scores[s][i]
}

let average = total / scores[s].length

document.getElementById("avgResult").innerText =
"Average Score: " + average

</script>

</body>
</html>

</body>
</html>
