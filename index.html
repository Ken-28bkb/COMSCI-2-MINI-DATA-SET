<!DOCTYPE html>
<html>
<head>

<title>GradeTrackr</title>

<style>

body{
font-family: Arial;
background:#fff5e6;
text-align:center;
padding:20px;
}

.container{
background:white;
padding:20px;
border-radius:10px;
width:85%;
margin:auto;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h1{
color:#e67e22;
}

h3{
color:#d35400;
margin-top:25px;
}

hr{
border: none;
height: 2px;
background: #e67e22;
margin: 25px 0;
}

button{
background:#e67e22;
color:white;
border:none;
padding:6px 10px;
margin:5px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#d35400;
}

input{
padding:6px;
margin:5px;
border-radius:5px;
border:1px solid #ccc;
width:70px;
}

table{
border-collapse:collapse;
margin:auto;
margin-top:20px;
width:100%;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{
background:#e67e22;
color:white;
}

.section{
margin-top:20px;
}

.item{
margin:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>📘 GradeTrackr</h1>
<p>Student Grade Management System</p>

<!-- SUBJECTS -->
<div class="section">
<h3>Subjects</h3>
<button onclick="addSubject()">+ Add Subject</button>
<div id="subjectList"></div>
</div>

<hr>

<!-- STUDENTS -->
<div class="section">
<h3>Students</h3>
<button onclick="addStudent()">+ Add Student</button>
<div id="studentList"></div>
</div>

<hr>

<!-- TABLE -->
<div class="section">
<h3>Grades Table</h3>
<table id="gradeTable">
<thead></thead>
<tbody></tbody>
</table>
</div>

<hr>

<!-- GET GRADE -->
<div class="section">
<h3>Get Grade</h3>
<input id="getStudent" type="number" placeholder="Student #">
<input id="getSubject" type="number" placeholder="Subject #">
<button onclick="getGrade()">Get</button>
<p id="result"></p>
</div>

<hr>

<!-- UPDATE GRADE -->
<div class="section">
<h3>Upgrade Grade</h3>
<input id="upStudent" type="number" placeholder="Student #">
<input id="upSubject" type="number" placeholder="Subject #">
<input id="newGrade" type="number" placeholder="Grade">
<button onclick="upgradeGrade()">Update</button>
</div>

</div>

<script>

let subjects = []
let students = []
let grades = []


// ADD SUBJECT
function addSubject(){
let name = "Subject " + (subjects.length + 1)
subjects.push(name)

for(let i=0;i<grades.length;i++){
grades[i].push(0)
}

renderLists()
displayTable()
}


// ADD STUDENT
function addStudent(){
let name = "Student " + (students.length + 1)
students.push(name)

let row = []
for(let i=0;i<subjects.length;i++){
row.push(0)
}

grades.push(row)

renderLists()
displayTable()
}


// REMOVE SUBJECT
function removeSubject(index){

subjects.splice(index,1)

for(let i=0;i<grades.length;i++){
grades[i].splice(index,1)
}

renderLists()
displayTable()
}


// REMOVE STUDENT
function removeStudent(index){

students.splice(index,1)
grades.splice(index,1)

renderLists()
displayTable()
}


// RENDER LISTS
function renderLists(){

let subjectDiv = document.getElementById("subjectList")
subjectDiv.innerHTML = ""

for(let i=0;i<subjects.length;i++){
subjectDiv.innerHTML += `
<div class="item">
<b>[#${i+1}]</b>
<input value="${subjects[i]}" 
onchange="renameSubject(${i}, this.value)">
<button onclick="removeSubject(${i})">❌</button>
</div>`
}

let studentDiv = document.getElementById("studentList")
studentDiv.innerHTML = ""

for(let i=0;i<students.length;i++){
studentDiv.innerHTML += `
<div class="item">
<b>Student ${i+1}:</b>
<input value="${students[i]}" 
onchange="renameStudent(${i}, this.value)">
<button onclick="removeStudent(${i})">❌</button>
</div>`
}

}


// RENAME
function renameSubject(i,val){
subjects[i] = val
displayTable()
}

function renameStudent(i,val){
students[i] = val
displayTable()
}


// DISPLAY TABLE
function displayTable(){

let thead = document.querySelector("#gradeTable thead")
let tbody = document.querySelector("#gradeTable tbody")

thead.innerHTML = ""
tbody.innerHTML = ""

// header
let header = "<tr><th>#</th><th>Student</th>"

for(let i=0;i<subjects.length;i++){
header += `<th>[#${i+1}] ${subjects[i]}</th>`
}

header += "</tr>"
thead.innerHTML = header


// rows
for(let i=0;i<students.length;i++){

let row = `<tr><td>${i+1}</td><td>${students[i]}</td>`

for(let j=0;j<subjects.length;j++){

let value = grades[i][j] ?? 0

row += `<td>
<input type="number" min="0" max="99" value="${value}" 
oninput="limitGrade(this)"
onchange="updateGrade(${i},${j},this.value)">
</td>`
}

row += "</tr>"
tbody.innerHTML += row
}

}


// LIMIT INPUT
function limitGrade(input){
if(input.value.length > 2){
input.value = input.value.slice(0,2)
}
if(input.value > 99){
input.value = 99
}
if(input.value < 0){
input.value = 0
}
}


// UPDATE GRADE
function updateGrade(i,j,val){
grades[i][j] = Number(val)
}


// GET GRADE
function getGrade(){

let s = Number(document.getElementById("getStudent").value) - 1
let sub = Number(document.getElementById("getSubject").value) - 1

if(!students[s] || grades[s][sub] == undefined){
document.getElementById("result").innerText = "Invalid input"
return
}

document.getElementById("result").innerText =
students[s] + " - " + subjects[sub] + ": " + grades[s][sub]

}


// UPGRADE GRADE
function upgradeGrade(){

let s = Number(document.getElementById("upStudent").value) - 1
let sub = Number(document.getElementById("upSubject").value) - 1
let newG = Number(document.getElementById("newGrade").value)

if(newG > 99) newG = 99
if(newG < 0) newG = 0

if(!students[s] || grades[s][sub] == undefined){
alert("Invalid input")
return
}

grades[s][sub] = newG
displayTable()

}

</script>

</body>
</html>
