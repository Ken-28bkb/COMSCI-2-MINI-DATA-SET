<!DOCTYPE html>
<html>
<head>

<title>ScoreTrackr</title>

<style>

body{
font-family: Arial, sans-serif;
background:#eef2f7;
padding:30px;
text-align:center;
}

.container{
background:white;
padding:25px;
border-radius:10px;
width:75%;
margin:auto;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
color:#2c3e50;
}

h3{
margin-top:30px;
color:#34495e;
}

table{
border-collapse:collapse;
margin:auto;
width:100%;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#2ecc71;
color:white;
}

input{
padding:8px;
margin:5px;
width:100px;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:8px 15px;
margin:6px;
border:none;
border-radius:5px;
background:#3498db;
color:white;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

.section{
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 ScoreTrackr</h1>
<p>Simple Student Score Management System</p>

<div class="section">
<h3>Add Student</h3>

<input id="name" placeholder="Name">
<input id="math" type="number" placeholder="Math">
<input id="science" type="number" placeholder="Science">
<input id="english" type="number" placeholder="English">

<button onclick="addStudent()">Add</button>
</div>

<table id="scoreTable">
<thead>
<tr>
<th>Name</th>
<th>Math</th>
<th>Science</th>
<th>English</th>
<th>Average</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="section">
<h3>Get Score</h3>

<input id="accessStudent" type="number" placeholder="Student Index">
<input id="accessSubject" type="number" placeholder="0-Math 1-Sci 2-Eng">

<button onclick="accessScore()">Get</button>
<p id="accessResult"></p>
</div>

<div class="section">
<h3>Update Score</h3>

<input id="updateStudent" type="number" placeholder="Student Index">
<input id="updateSubject" type="number" placeholder="0-Math 1-Sci 2-Eng">
<input id="newScore" type="number" placeholder="New Score">

<button onclick="updateScore()">Update</button>
</div>

<div class="section">
<h3>Compute Average</h3>

<input id="avgStudent" type="number" placeholder="Student Index">

<button onclick="computeAverage()">Compute</button>
<p id="avgResult"></p>
</div>

</div>

<script>

let scores = []
let names = []

function displayScores(){

let table = document.querySelector("#scoreTable tbody")
table.innerHTML=""

for(let i=0;i<scores.length;i++){

let total = scores[i].reduce((a,b)=>a+b,0)
let avg = (total / scores[i].length).toFixed(2)

let row="<tr>"
row += "<td>"+names[i]+"</td>"

for(let j=0;j<scores[i].length;j++){
row += "<td>"+scores[i][j]+"</td>"
}

row += "<td>"+avg+"</td>"
row+="</tr>"

table.innerHTML += row
}

}

// add student
function addStudent(){

let name = document.getElementById("name").value.trim()

let math = Number(document.getElementById("math").value)
let science = Number(document.getElementById("science").value)
let english = Number(document.getElementById("english").value)

if(name=="" || isNaN(math) || isNaN(science) || isNaN(english)){
alert("Complete all fields.")
return
}

scores.push([math,science,english])
names.push(name)

displayScores()

document.getElementById("name").value=""
document.getElementById("math").value=""
document.getElementById("science").value=""
document.getElementById("english").value=""
}

// access score
function accessScore(){

let s = Number(document.getElementById("accessStudent").value)
let sub = Number(document.getElementById("accessSubject").value)

if(!scores[s] || scores[s][sub]==undefined){
document.getElementById("accessResult").innerText = "Invalid input."
return
}

document.getElementById("accessResult").innerText =
"Score: " + scores[s][sub]
}

// update score
function updateScore(){

let s = Number(document.getElementById("updateStudent").value)
let sub = Number(document.getElementById("updateSubject").value)
let newScore = Number(document.getElementById("newScore").value)

if(!scores[s] || scores[s][sub]==undefined){
alert("Invalid input.")
return
}

scores[s][sub] = newScore
displayScores()
}

// compute average
function computeAverage(){

let s = Number(document.getElementById("avgStudent").value)

if(!scores[s]){
document.getElementById("avgResult").innerText="Invalid student."
return
}

let total = scores[s].reduce((a,b)=>a+b,0)
let avg = total / scores[s].length

document.getElementById("avgResult").innerText =
"Average: " + avg.toFixed(2)
}

</script>

</body>
</html>
